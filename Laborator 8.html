<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformare Imagine Negativ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            color: white;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            color: #b0bec5;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #00dbde;
            background: rgba(255, 255, 255, 0.12);
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 20px 0;
        }

        .upload-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 219, 222, 0.4);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        #file-input {
            display: none;
        }

        .file-info {
            margin-top: 15px;
            color: #90a4ae;
            font-size: 0.9rem;
        }

        .images-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            .images-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        .image-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
        }

        .image-box:hover {
            transform: translateY(-10px);
        }

        .image-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #00dbde;
            font-weight: bold;
        }

        .canvas-container {
            width: 100%;
            height: 400px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            border-radius: 10px;
        }

        .placeholder {
            color: #78909c;
            font-style: italic;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(90deg, #2193b0, #6dd5ed);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
            justify-content: center;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(33, 147, 176, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn.reset {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
        }

        .control-btn.download {
            background: linear-gradient(90deg, #56ab2f, #a8e063);
        }

        .info {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            text-align: left;
            border-left: 5px solid #00dbde;
        }

        .info h3 {
            color: #00dbde;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .info p {
            color: #b0bec5;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .formula {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            margin: 15px 0;
            text-align: center;
            color: #ffcc80;
        }

        .pixel-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 20px;
        }

        .pixel-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            min-width: 150px;
        }

        .pixel-title {
            font-size: 0.9rem;
            color: #90a4ae;
            margin-bottom: 5px;
        }

        .pixel-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00dbde;
        }

        footer {
            margin-top: 40px;
            color: #78909c;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Transformare Imagine Negativ</h1>
        <p class="subtitle">Încarcă o imagine și transform-o în negativ fotografic folosind formula RGB</p>
        
        <div class="upload-section">
            <label for="file-input" class="upload-btn">
                📁 Încarcă Imagine
                <input type="file" id="file-input" accept="image/*">
            </label>
            <p class="file-info">Acceptă: JPG, PNG, GIF, BMP (max 5MB)</p>
        </div>
        
        <div class="images-container">
            <div class="image-box">
                <div class="image-title">Imaginea Originală</div>
                <div class="canvas-container">
                    <canvas id="original-canvas"></canvas>
                    <div id="original-placeholder" class="placeholder">Aici va apărea imaginea originală</div>
                </div>
            </div>
            
            <div class="image-box">
                <div class="image-title">Imagine Negativă</div>
                <div class="canvas-container">
                    <canvas id="negative-canvas"></canvas>
                    <div id="negative-placeholder" class="placeholder">Aici va apărea imaginea negativă</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="transform-btn" onclick="transformToNegative()">
                🔄 Transformă în Negativ
            </button>
            <button class="control-btn reset" onclick="resetAll()">
                🗑️ Resetare Tot
            </button>
            <button class="control-btn download" onclick="downloadNegative()">
                💾 Descarcă Negativul
            </button>
        </div>
        
       

    <script>
        // Elemente DOM
        const fileInput = document.getElementById('file-input');
        const originalCanvas = document.getElementById('original-canvas');
        const negativeCanvas = document.getElementById('negative-canvas');
        const originalCtx = originalCanvas.getContext('2d');
        const negativeCtx = negativeCanvas.getContext('2d');
        const originalPlaceholder = document.getElementById('original-placeholder');
        const negativePlaceholder = document.getElementById('negative-placeholder');
        const transformBtn = document.getElementById('transform-btn');
        
        // Variabile pentru imagine
        let originalImage = null;
        let imageLoaded = false;
        
        // Funcție pentru încărcarea imaginii
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Verificăm tipul fișierului
            if (!file.type.match('image.*')) {
                alert('Te rog alege un fișier imagine (JPG, PNG, GIF, BMP)');
                return;
            }
            
            // Verificăm dimensiunea (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert('Imaginea este prea mare. Maxim 5MB permis.');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(event) {
                // Creăm un obiect Image
                const img = new Image();
                
                img.onload = function() {
                    // Setăm dimensiunile canvas-ului
                    const maxWidth = 500;
                    const maxHeight = 400;
                    
                    // Calculăm dimensiunile păstrând proporțiile
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = (maxWidth / width) * height;
                        width = maxWidth;
                    }
                    
                    if (height > maxHeight) {
                        width = (maxHeight / height) * width;
                        height = maxHeight;
                    }
                    
                    originalCanvas.width = width;
                    originalCanvas.height = height;
                    negativeCanvas.width = width;
                    negativeCanvas.height = height;
                    
                    // Desenăm imaginea pe canvas-ul original
                    originalCtx.drawImage(img, 0, 0, width, height);
                    
                    // Ascundem placeholder-urile
                    originalPlaceholder.style.display = 'none';
                    originalCanvas.style.display = 'block';
                    negativePlaceholder.style.display = 'block';
                    negativeCanvas.style.display = 'none';
                    
                    // Salvăm imaginea originală
                    originalImage = img;
                    imageLoaded = true;
                    
                    // Activăm butonul de transformare
                    transformBtn.disabled = false;
                    transformBtn.style.opacity = '1';
                    transformBtn.style.cursor = 'pointer';
                    
                    // Resetăm canvas-ul negativ
                    negativeCtx.clearRect(0, 0, negativeCanvas.width, negativeCanvas.height);
                };
                
                img.src = event.target.result;
            };
            
            reader.readAsDataURL(file);
        });
        
        // Funcție pentru transformarea în negativ
        function transformToNegative() {
            if (!imageLoaded) {
                alert('Te rog încarcă mai întâi o imagine!');
                return;
            }
            
            // Obținem datele de imagine din canvas-ul original
            const imageData = originalCtx.getImageData(0, 0, originalCanvas.width, originalCanvas.height);
            const data = imageData.data;
            
            // Parcurgem fiecare pixel (4 bytes per pixel: R, G, B, A)
            for (let i = 0; i < data.length; i += 4) {
                // Transformăm în negativ: newColor = 255 - originalColor
                data[i] = 255 - data[i];       // R (Red)
                data[i + 1] = 255 - data[i + 1]; // G (Green)
                data[i + 2] = 255 - data[i + 2]; // B (Blue)
                // Alpha rămâne neschimbat (data[i + 3])
            }
            
            // Desenăm imaginea negativă pe canvas
            negativeCtx.putImageData(imageData, 0, 0);
            
            // Afișăm canvas-ul negativ
            negativePlaceholder.style.display = 'none';
            negativeCanvas.style.display = 'block';
            
            // Animăm transformarea
            negativeCanvas.style.transform = 'scale(0.9)';
            setTimeout(() => {
                negativeCanvas.style.transition = 'transform 0.5s';
                negativeCanvas.style.transform = 'scale(1)';
            }, 100);
            
            // Afișăm un mesaj de succes
            showMessage('✅ Imagine transformată în negativ cu succes!');
        }
        
        // Funcție pentru resetare
        function resetAll() {
            // Resetăm input-ul de fișier
            fileInput.value = '';
            
            // Ștergem canvas-urile
            originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
            negativeCtx.clearRect(0, 0, negativeCanvas.width, negativeCanvas.height);
            
            // Resetăm dimensiunile canvas-urilor
            originalCanvas.width = 0;
            originalCanvas.height = 0;
            negativeCanvas.width = 0;
            negativeCanvas.height = 0;
            
            // Afișăm placeholder-urile
            originalPlaceholder.style.display = 'block';
            negativePlaceholder.style.display = 'block';
            originalCanvas.style.display = 'none';
            negativeCanvas.style.display = 'none';
            
            // Resetăm variabilele
            originalImage = null;
            imageLoaded = false;
            
            // Dezactivăm butonul de transformare
            transformBtn.disabled = true;
            transformBtn.style.opacity = '0.7';
            transformBtn.style.cursor = 'not-allowed';
            
            showMessage('🔄 Toate setările au fost resetate!');
        }
        
        // Funcție pentru descărcarea imaginii negative
        function downloadNegative() {
            if (!imageLoaded || negativeCanvas.style.display === 'none') {
                alert('Mai întâi transformă o imagine în negativ!');
                return;
            }
            
            // Creăm un link pentru descărcare
            const link = document.createElement('a');
            link.download = 'imagine-negativa.png';
            link.href = negativeCanvas.toDataURL('image/png');
            
            // Simulăm click pe link
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showMessage('💾 Imaginea negativă a fost descărcată!');
        }
        
        // Funcție pentru afișarea mesajelor
        function showMessage(text) {
            // Creăm un element pentru mesaj
            const message = document.createElement('div');
            message.textContent = text;
            message.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(90deg, #00dbde, #fc00ff);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 1000;
                font-weight: bold;
                animation: slideIn 0.5s ease;
            `;
            
            document.body.appendChild(message);
            
            // Ștergem mesajul după 3 secunde
            setTimeout(() => {
                message.style.animation = 'slideOut 0.5s ease';
                setTimeout(() => {
                    document.body.removeChild(message);
                }, 500);
            }, 3000);
        }
        
        // Adăugăm stilurile pentru animații
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // Inițializare
        window.onload = function() {
            transformBtn.disabled = true;
            transformBtn.style.opacity = '0.7';
            transformBtn.style.cursor = 'not-allowed';
        };
    </script>
</body>
</html>
