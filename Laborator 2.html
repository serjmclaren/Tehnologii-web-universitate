<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul (2n)!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
            font-size: 16px;
        }

        .formula {
            background-color: #ecf0f1;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            border-left: 5px solid #3498db;
        }

        .input-group {
            margin: 25px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 16px;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }

        button {
            background: linear-gradient(to right, #3498db, #2c3e50);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(52, 152, 219, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 30px;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            display: none;
        }

        .result-title {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .calculation-steps {
            margin-top: 15px;
            padding: 15px;
            background-color: #dfe6e9;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3436;
            text-align: left;
            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .formula {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calcul Factorial (2n)!</h1>
        
        <p class="description">
            Introduceți o valoare pentru <strong>n</strong> pentru a calcula <strong>(2n)!</strong><br>
                  </p>
        
        <div class="formula">
            (2n)! = (2 × n)!
        </div>
        
        <div class="input-group">
            <label for="n">Introduceți valoarea lui n (număr natural):</label>
            <input type="number" id="n" min="0" value="5" placeholder="Ex: 5">
        </div>
        
        <button onclick="calculeazaFactorial()">Calculează (2n)!</button>
        
        <div id="rezultat" class="result-container">
            <div class="result-title">Rezultat:</div>
            <div id="valoare-rezultat" class="result-value"></div>
            <div id="pas-calcul" class="calculation-steps"></div>
        </div>
        
        <div class="footer">
            Calcul realizat folosind structuri repetitive în JavaScript
        </div>
    </div>

    <script>
        function calculeazaFactorial() {
     
            const n = parseInt(document.getElementById("n").value);
            const rezultatContainer = document.getElementById("rezultat");
            const valoareRezultat = document.getElementById("valoare-rezultat");
            const pasCalcul = document.getElementById("pas-calcul");
            
 
            if (isNaN(n) || n < 0) {
                valoareRezultat.textContent = "Vă rugăm introduceți un număr natural (≥ 0)";
                rezultatContainer.style.display = "block";
                return;
            }
        
            const k = 2 * n;
            

            let factorial = 1;
            let pasiText = `(2×${n})! = ${k}! = `;            if (k === 0) {
                factorial = 1;
                pasiText += "1";
            } else {
                // Calcul factorial cu buclă for
                for (let i = 1; i <= k; i++) {
                    factorial *= i;
             
                    if (i === 1) {
                        pasiText += "1";
                    } else {
                        pasiText += ` × ${i}`;
                    }
                }
                
                pasiText += ` = ${formatNumber(factorial)}`;
            }
            
            valoareRezultat.textContent = formatNumber(factorial);
            pasCalcul.textContent = pasiText;

            rezultatContainer.style.display = "block";
            
             valoareRezultat.style.opacity = "0";
            valoareRezultat.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                valoareRezultat.style.transition = "opacity 0.5s, transform 0.5s";
                valoareRezultat.style.opacity = "1";
                valoareRezultat.style.transform = "translateY(0)";
            }, 100);
        }
        
        function formatNumber(num) {
            if (num < 1000) return num.toString();
       
            if (num > 1e15) return num.toExponential(6);
    
            return num.toLocaleString('ro-RO');
        }
        
           window.onload = function() {
            calculeazaFactorial();
        };
   
        document.getElementById("n").addEventListener("input", function() {
                 const n = parseInt(this.value);
            if (n > 50) {
                this.value = 50;
                alert("Pentru performanță, valoarea maximă permisă este 50. (2×50)! = 100! este un număr foarte mare.");
            }
            
            if (!isNaN(n) && n >= 0 && n <= 50) {
                calculeazaFactorial();
            }
        });
    </script>
</body>
</html>
